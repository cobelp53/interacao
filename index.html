<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cine & Hospedagem - Links Úteis</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="container">
        <header class="banner-container">
            <img src="banner.jpg" alt="Banner de Boas-Vindas" class="main-banner">
        </header>

        <main class="links-section">
            <h2>Seja bem-vindo(a)!</h2>
            <p>Escolha uma das opções abaixo para interagir conosco:</p>

            <div class="button-list">
                <a href="[LINK_DA_VOTACAO_DE_FILMES]" target="_blank" class="btn btn-cinema">
                    <i class="fa-solid fa-film"></i>
                    <span>Votação de Filmes para o Cinema</span>
                </a>

                <a href="[LINK_DO_WHATSAPP]" target="_blank" class="btn btn-whatsapp">
                    <i class="fa-brands fa-whatsapp"></i>
                    <span>Grupo do WhatsApp</span>
                </a>

                <a href="[LINK_DA_AVALIACAO_HOTELARIA]" target="_blank" class="btn btn-hotel">
                    <i class="fa-solid fa-hotel"></i>
                    <span>Avaliação da Hotelaria</span>
                </a>
            </div>
        </main>

        <footer>
            <p>© 2026 Todos os direitos reservados.</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
